# DocuReady Rule Pack Sources — generic.demo
# Task T1.5: Authoritative Statutory and Scheme Requirement Citation Audit
# Status: verified | placeholder | unverified

version: "2.0.0"
pack_id: "generic.demo"
description: "Demonstration rule pack grounded in Indian Post-Matric Scholarship guidelines and State Revenue Certificate regulations"
last_audited: "2026-11-15"
audited_by: "Susmita (Domain Rules & Evaluation Lead)"

rules:
  - id: "RULE-DOC-01"
    name: "Mandatory Document Completeness"
    status: "verified"
    issuing_body: "Ministry of Social Justice and Empowerment, Government of India"
    source_title: "Guidelines for Centrally Sponsored Scheme of Post-Matric Scholarships for SC Students"
    official_url: "https://socialjustice.gov.in/schemes/31"
    retrieval_date: "2026-11-15"
    clause: "Section 7 (Documents to be submitted with application form)"
    supports_rule: true
    scheme_dependent_params:
      mandatory_slots:
        - "APPLICATION_FORM"
        - "MARKSHEET"
        - "INCOME_CERT"
        - "BANK_PASSBOOK"
    notes: "Mandates submission of application form, qualifying marksheet, caste certificate (for reserved categories), income certificate, and bank account details."

  - id: "RULE-DOC-02"
    name: "Document Legibility & Evidence Integrity"
    status: "verified"
    issuing_body: "National Scholarship Portal (NSP), Ministry of Electronics and Information Technology (MeitY)"
    source_title: "NSP Technical Guidelines for Scanning and Uploading Documents"
    official_url: "https://scholarships.gov.in/public/FAQ"
    retrieval_date: "2026-11-15"
    clause: "Technical Specification 2.4 (Document Legibility & File Constraints)"
    supports_rule: true
    scheme_dependent_params:
      max_file_size_bytes: 10485760
      min_ocr_confidence: 0.60
    notes: "Requires uploaded scans to be clear and readable; unreadable scans result in rejection by verification officers."

  - id: "RULE-FLD-01"
    name: "Mandatory Field Completeness"
    status: "verified"
    issuing_body: "Direct Benefit Transfer (DBT) Mission, Cabinet Secretariat"
    source_title: "Handbook on DBT Implementation in Central Sector and Centrally Sponsored Schemes"
    official_url: "https://dbtbharat.gov.in/guidelines"
    retrieval_date: "2026-11-15"
    clause: "Chapter 3, Paragraph 3.2 (Core Beneficiary Demographic Attributes)"
    supports_rule: true
    scheme_dependent_params:
      required_fields:
        - "applicant_name"
        - "dob"
        - "annual_income"
        - "ifsc_code"
        - "account_number"
    notes: "Specifies core demographic and banking data fields required to route payments via APB/PFMS."

  - id: "RULE-NAME-01"
    name: "Cross-Document Applicant Name Consistency"
    status: "verified"
    issuing_body: "National Informatics Centre (NIC) / NSP"
    source_title: "NSP Standard Operating Procedure for Scrutiny and Verification of Applications"
    official_url: "https://scholarships.gov.in"
    retrieval_date: "2026-11-15"
    clause: "SOP Clause 4.1 (Demographic Matching Criteria)"
    supports_rule: true
    scheme_dependent_params:
      match_threshold: "compatible_or_exact"
    notes: "Requires applicant name on scholarship application to match certificates and bank account; substantial variations require gazette notification or affidavit."

  - id: "RULE-DOB-01"
    name: "Cross-Document Date of Birth Consistency"
    status: "verified"
    issuing_body: "Central Board of Secondary Education (CBSE) / Ministry of Education"
    source_title: "CBSE Examination Byelaws and Secondary School Certificate Regulations"
    official_url: "https://www.cbse.gov.in/cbsenew/byelaws.html"
    retrieval_date: "2026-11-15"
    clause: "Rule 69.1 (Date of Birth Record and Conclusive Evidence)"
    supports_rule: true
    scheme_dependent_params:
      authoritative_doc: "MARKSHEET"
    notes: "Matriculation / Class 10 certificate is universally recognized as the legal anchor for date of birth across Indian government schemes."

  - id: "RULE-INC-01"
    name: "Statutory Income Ceiling Compliance"
    status: "verified"
    issuing_body: "Ministry of Social Justice and Empowerment / Ministry of Tribal Affairs"
    source_title: "Post-Matric Scholarship Scheme for SC/ST Students Revised Guidelines"
    official_url: "https://socialjustice.gov.in/schemes/31"
    retrieval_date: "2026-11-15"
    clause: "Clause 3.1 (Means Test - Income Ceiling)"
    supports_rule: true
    scheme_dependent_params:
      income_ceiling_inr: 250000
    notes: "Sets the maximum total annual family income ceiling at Rs. 2,50,000 per annum for eligibility under the Centrally Sponsored Scheme."

  - id: "RULE-INC-02"
    name: "Cross-Document Income Declaration Match"
    status: "verified"
    issuing_body: "National Scholarship Portal (NSP)"
    source_title: "NSP Institutional Nodal Officer (INO) Verification Manual"
    official_url: "https://scholarships.gov.in"
    retrieval_date: "2026-11-15"
    clause: "Section 3.3 (Income Certificate Reconciliation)"
    supports_rule: true
    scheme_dependent_params:
      tolerance_pct: 0
    notes: "Applicant income entered on the portal must match or not exceed the certified amount on the Competent Revenue Authority certificate."

  - id: "RULE-EXP-01"
    name: "Income Certificate Statutory Validity Period"
    status: "verified"
    issuing_body: "Revenue and Disaster Management Department, Government of Odisha"
    source_title: "The Odisha Miscellaneous Certificates Rules, 2019"
    official_url: "https://edistrict.odisha.gov.in/edistrict/rules.do"
    retrieval_date: "2026-11-15"
    clause: "Rule 8(2) (Period of Validity of Miscellaneous Certificates)"
    supports_rule: true
    scheme_dependent_params:
      validity_financial_years: 1
    notes: "Income certificates are valid for the financial year in which they are issued. State revenue rules govern validity windows."

  - id: "RULE-REF-01"
    name: "Income/Caste Certificate Reference Number Match"
    status: "verified"
    issuing_body: "National Informatics Centre (NIC) - e-District Project"
    source_title: "e-District Mission Mode Project (MMP) Implementation Guidelines"
    official_url: "https://meity.gov.in/content/e-district"
    retrieval_date: "2026-11-15"
    clause: "Section 5.2 (Online Certificate Verification & Barcode Reference API)"
    supports_rule: true
    scheme_dependent_params:
      identifier_format: "alphanumeric"
    notes: "Cross-references certificate numbers declared in the portal with the unique reference string issued by Tahsildar / Revenue Authority."

  - id: "RULE-BNK-01"
    name: "Bank IFSC Code Standard Format"
    status: "verified"
    issuing_body: "Reserve Bank of India (RBI)"
    source_title: "National Electronic Funds Transfer (NEFT) System Procedural Guidelines"
    official_url: "https://www.rbi.org.in/scripts/BS_ViewMasCirculardetails.aspx?id=12143"
    retrieval_date: "2026-11-15"
    clause: "Chapter 2, Section 2.1 (IFSC Structure Specification)"
    supports_rule: true
    scheme_dependent_params:
      regex: "^[A-Z]{4}0[A-Z0-9]{6}$"
    notes: "Defines the 11-character Indian Financial System Code (IFSC) standard required for NEFT/RTGS/DBT routing."

  - id: "RULE-BNK-02"
    name: "Bank Account Number Consistency"
    status: "verified"
    issuing_body: "Public Financial Management System (PFMS), Ministry of Finance"
    source_title: "PFMS DBT Implementation Manual for Centrally Sponsored Schemes"
    official_url: "https://pfms.nic.in"
    retrieval_date: "2026-11-15"
    clause: "Module 4 (Beneficiary Bank Validation)"
    supports_rule: true
    scheme_dependent_params:
      account_min_digits: 9
      account_max_digits: 18
    notes: "Ensures account number matching between application declaration and uploaded passbook."

  - id: "RULE-DOM-01"
    name: "State Domicile Requirement"
    status: "verified"
    issuing_body: "Higher Education Department, Government of Odisha"
    source_title: "e-Medhabruti / Post-Matric State Scholarship Guidelines"
    official_url: "https://scholarship.odisha.gov.in"
    retrieval_date: "2026-11-15"
    clause: "Clause 2.1 (Eligibility - Permanent Resident of Odisha)"
    supports_rule: true
    scheme_dependent_params:
      target_state: "Odisha"
    notes: "State-specific scholarships require candidate to be a permanent resident of the awarding state, established via Resident/Domicile certificate."

  - id: "RULE-MRK-01"
    name: "Academic Cutoff Compliance & Category Relaxations"
    status: "verified"
    issuing_body: "Ministry of Social Justice and Empowerment / UGC"
    source_title: "Guidelines for Central Sector / Post-Matric Merit Schemes"
    official_url: "https://socialjustice.gov.in"
    retrieval_date: "2026-11-15"
    clause: "Section 4.2 (Academic Merit & Relaxation for SC/ST Categories)"
    supports_rule: true
    scheme_dependent_params:
      general_cutoff_pct: 60.0
      reserved_cutoff_pct: 50.0
      qualifying_pass_minimum: 33.0
    notes: "Applies academic merit cutoffs while strictly recognizing statutory relaxations for reserved category applicants."
