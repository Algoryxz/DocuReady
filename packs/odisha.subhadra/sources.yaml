    url: "https://subhadra.odisha.gov.in"
    retrieved_on: 2026-11-21
    status: "unverified"
    reviewed_by: "Susmita (Domain Rules, Evidence & Evaluation Lead)"
    clause: "Administrative Portal Reference"
    supports_rule: false
    notes: "Statutory Gazette No. 1637 Section 2(a) defines the multi-year scheme lifespan (FY 2024–25 to FY 2028–29) but does not enact a definitive application intake closing date. The portal URL is only a general administrative reference, not proof of a specific intake window or closing deadline. Status remains UNVERIFIED. The 16.09.2026 secondary report about a proposed 01.04.2027 reopening is recorded separately as SRC-SUB-ANNOUNCEMENT-2026-09-16 with supports_rule: false; no corresponding date-specific official written notification has been produced or verified. The historical 2024-09-05 to 2025-03-31 demo snapshot boundary is not an established Government application closing date."


