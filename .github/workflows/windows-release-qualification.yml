name: Windows desktop release qualification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "sidecar/**"
      - "src/**"
      - "tests/**"
      - "scripts/verify_clean_windows_runtime.ps1"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/windows-release-qualification.yml"
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "sidecar/**"
      - "src/**"
      - "tests/**"
      - "scripts/verify_clean_windows_runtime.ps1"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/windows-release-qualification.yml"

permissions:
  contents: read

concurrency:
  group: docuready-windows-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qualify:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install and configure Tesseract OCR with language packs
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $tesseractRoot = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tesseractRoot\tesseract.exe")) {
            throw "Tesseract installation failed: $tesseractRoot\tesseract.exe not found."
          }

          # Update GITHUB_PATH and current step PATH
          "$tesseractRoot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$tesseractRoot;$env:PATH"

          # Pinned official source for missing language packs (Odia and Hindi)
          $tessdataDir = "$tesseractRoot\tessdata"
          if (-not (Test-Path $tessdataDir)) {
            New-Item -ItemType Directory -Path $tessdataDir -Force | Out-Null
          }

          $pinnedBaseUrl = "https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0"
          $langPacks = @(
            @{ Name = "ori.traineddata"; Sha256 = "36f3135e61d501a3acfad41f5fe60b8e791274fff4c5375c969fdcca980cdbac" },
            @{ Name = "hin.traineddata"; Sha256 = "4c73ffc59d497c186b19d1e90f5d721d678ea6b2e277b719bee4e2af12271825" }
          )

          foreach ($pack in $langPacks) {
            $dest = Join-Path $tessdataDir $pack.Name
            if (-not (Test-Path $dest)) {
              Write-Host "Downloading $($pack.Name) from $pinnedBaseUrl..."
              Invoke-WebRequest -Uri "$pinnedBaseUrl/$($pack.Name)" -OutFile $dest
            }
            $hash = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $pack.Sha256.ToLowerInvariant()) {
              throw "Hash mismatch for $($pack.Name)! Expected $($pack.Sha256), got $hash"
            }
            Write-Host "Verified $($pack.Name): SHA256 $hash"
          }

          # Verify Tesseract binary and discovered languages
          & "$tesseractRoot\tesseract.exe" --version
          $availableLangs = (& "$tesseractRoot\tesseract.exe" --list-langs) | ForEach-Object { $_.Trim() }
          Write-Host "Available Tesseract languages:"
          $availableLangs | ForEach-Object { Write-Host " - $_" }

          foreach ($required in @("eng", "ori", "hin")) {
            if ($availableLangs -notcontains $required) {
              throw "Required Tesseract language '$required' is missing from Tesseract installation!"
            }
          }
          Write-Host "All required language packs (eng, ori, hin) verified."

      - name: Install Python engine and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" "pyinstaller>=6,<7"
          python -c "import pytesseract; print('pytesseract languages:', pytesseract.get_languages())"
          python -m pytest -q

      - name: Build standalone Python sidecar
        shell: pwsh
        run: |
          pyinstaller sidecar/docuready_sidecar.spec --noconfirm --clean
          if (-not (Test-Path "sidecar/dist/docuready_sidecar/docuready_sidecar.exe")) {
            throw "PyInstaller did not produce the standalone sidecar executable."
          }

      - name: Stage bundled Tesseract OCR runtime in sidecar
        shell: pwsh
        run: |
          $tesseractRoot = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tesseractRoot/tesseract.exe")) {
            throw "Tesseract installation did not produce tesseract.exe."
          }
          $target = "sidecar/dist/docuready_sidecar/tesseract"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item "$tesseractRoot/*" $target -Recurse -Force
          foreach ($file in @("eng.traineddata", "osd.traineddata", "ori.traineddata", "hin.traineddata")) {
            if (-not (Test-Path "$target/tessdata/$file")) {
              throw "Traineddata '$file' is missing from staged sidecar runtime: $target/tessdata/$file"
            }
          }

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Type-check desktop
        working-directory: apps/desktop
        run: npm run lint:types

      - name: Run desktop tests
        working-directory: apps/desktop
        run: npm test

      - name: Build Windows installer and portable ZIP
        working-directory: apps/desktop
        run: npm run make

      - name: Verify expected release outputs
        shell: pwsh
        run: |
          $setup = "apps/desktop/out/make/squirrel.windows/x64/DocuReady-0.1.0-Setup.exe"
          $zip = "apps/desktop/out/make/zip/win32/x64/DocuReady-win32-x64-0.1.0.zip"
          if (-not (Test-Path $setup)) { throw "Squirrel installer missing: $setup" }
          if (-not (Test-Path $zip)) { throw "Portable ZIP missing: $zip" }
          Get-FileHash $setup -Algorithm SHA256 | Format-List
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Install, launch, smoke-test sidecar, and uninstall
        shell: pwsh
        run: ./scripts/verify_clean_windows_runtime.ps1

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docuready-windows-qualification-${{ github.run_number }}
          path: |
            apps/desktop/out/make/squirrel.windows/x64/DocuReady-0.1.0-Setup.exe
            apps/desktop/out/make/zip/win32/x64/DocuReady-win32-x64-0.1.0.zip
            docs/clean_machine_validation.log
          if-no-files-found: warn
          retention-days: 14
