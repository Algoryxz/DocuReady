name: CI Tests

on:
  push:
    branches: [ main, "feature/**", "task/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements/ci-lock-py${{ matrix.python-version }}.txt

    - name: Install System Dependencies (Tesseract OCR & Language Packs)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          tesseract-ocr \
          tesseract-ocr-eng \
          tesseract-ocr-ori \
          tesseract-ocr-hin \
          libtesseract-dev

    - name: Verify Tesseract OCR & Language Pack Installation
      run: |
        echo "=== Tesseract OCR & Language Verification ==="
        tesseract --version
        echo "Installed Tesseract Languages:"
        tesseract --list-langs

        LANGS=$(tesseract --list-langs)
        for lang in eng ori hin; do
          if echo "$LANGS" | grep -Fxq "$lang"; then
            echo "PASS: Required Tesseract language '$lang' is available."
          else
            echo "FAIL: Required Tesseract language '$lang' is missing!" >&2
            exit 1
          fi
        done
        echo "All required language packs (eng, ori, hin) successfully verified."
        echo "=============================================="

    - name: Install Locked Dependencies
      run: |
        pip install --require-hashes -r requirements/ci-lock-py${{ matrix.python-version }}.txt

    - name: Install Package in Editable Mode with Declared Extras
      run: |
        pip install --no-deps --no-build-isolation -e ".[ui,generator,dev]"

    - name: Verify Package Imports & CLI Entry Point
      run: |
        python -c "import docuready; print('docuready version:', docuready.__version__)"
        python -c "from docuready.domain.models import DocumentType; print('Domain model import verified')"
        python -c "from docuready.interfaces.ui.app import _find_synthetic_data_dir; print('UI module import verified')"
        docuready --help

    - name: Output Environment Diagnostics
      run: |
        echo "=== Environment Diagnostics ==="
        python --version
        python -m pip --version
        python -c "import pymupdf; print('PyMuPDF:', getattr(pymupdf, '__version__', 'unknown'))"
        python -c "import PIL; print('Pillow:', PIL.__version__)"
        python -c "import pytesseract; print('pytesseract:', pytesseract.__version__)"
        python -c "import pytesseract; print('pytesseract available languages:', pytesseract.get_languages())"
        tesseract --version
        echo "Installed Tesseract Languages:"
        tesseract --list-langs
        echo "================================"

    - name: Build Distribution Packages (sdist and wheel)
      run: |
        python -m build --no-isolation
        echo "=== Verifying Built Distribution Artifacts ==="
        ls -la dist/
        test -f dist/docuready-0.1.0.tar.gz
        test -f dist/docuready-0.1.0-py3-none-any.whl
        echo "PASS: sdist (.tar.gz) and wheel (.whl) verified."
        echo "=============================================="

    - name: Explicitly Exercise OCR Extraction Path (Packet 07 Semantic OCR)
      run: |
        pytest -vv tests/test_golden_baseline.py::test_golden_baseline_packet_07_semantic_ocr -W "error:::docuready.*"

    - name: Verify Genuine OCR Recognition & Language Packs (T0.2 Integration Test)
      run: |
        pytest -vv tests/test_ocr_integration.py -W "error:::docuready.*"

    - name: Run Test Suite (Unit, Adversarial, Golden Baseline & OCR Integration)
      run: |
        pytest tests/ -v --tb=short -W "error:::docuready.*"

    - name: Verify CLI Benchmark & Audit Functionality
      run: |
        docuready benchmark
        docuready audit synthetic_data/pkt_01_clean --json

    - name: Verify Wheel in Isolated Virtual Environment
      run: |
        python -m venv test_wheel_venv
        test_wheel_venv/bin/python -m pip install \
          --require-hashes \
          -r requirements/ci-lock-py${{ matrix.python-version }}.txt
        test_wheel_venv/bin/python -m pip install --no-deps dist/*.whl
        test_wheel_venv/bin/python -m pip check
        test_wheel_venv/bin/docuready --help
        test_wheel_venv/bin/python -c "import docuready; print('Isolated wheel version:', docuready.__version__)"
        cd /tmp
        echo "=== Out-of-Repository Wheel & Console Script Verification ==="
        $GITHUB_WORKSPACE/test_wheel_venv/bin/python -c "import docuready; print('Imported docuready from:', docuready.__file__); assert 'site-packages' in docuready.__file__, 'Error: docuready not imported from site-packages!'"
        $GITHUB_WORKSPACE/test_wheel_venv/bin/docuready --help
        $GITHUB_WORKSPACE/test_wheel_venv/bin/docuready audit $GITHUB_WORKSPACE/synthetic_data/pkt_01_clean --json
        echo "PASS: Out-of-repository package import, help, and audit verified."
        echo "============================================================"
