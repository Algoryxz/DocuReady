[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docuready"
version = "0.1.0"
description = "Local-first, deterministic pre-submission document readiness and cross-verification linter for Indian citizens and students"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "Apache-2.0"}
authors = [
    {name = "DocuReady Contributors"}
]
keywords = [
    "document-verification",
    "civic-tech",
    "scholarship",
    "deterministic",
    "pdf-validation",
    "india"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.0.0",
    "pymupdf==2.1",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pytesseract>=0.3.10",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30.0",
]
generator = [
    "reportlab>=4.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pyyaml>=6.0.0",
    "build>=1.0.0",
    "setuptools>=61.0.0",
    "wheel",
]
all = [
    "streamlit>=1.30.0",
    "reportlab>=4.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pyyaml>=6.0.0",
    "build>=1.0.0",
    "setuptools>=61.0.0",
    "wheel",
]

[project.scripts]
docuready = "docuready.interfaces.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["docuready*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error:::docuready.*",
]
